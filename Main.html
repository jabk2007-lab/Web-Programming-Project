<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Fundamentals Lab</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Dashboard</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Courses</a>
            <a href="#">Projects</a>
        </nav>
    </header>


    <main>

        <section class="profile">

            <div class="avatar">
                AG
            </div>

            <div>
                <h2>Anthony Guzman</h2>
                <p>Computer Science Student</p>
            </div>

            <span class="status">
                Online
            </span>

        </section>

            <section class="form-container">
    <h2>Create an Account</h2>

    <form>
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <div class="form-group">
            <label for="course">Favorite Course</label>
            <select id="course">
                <option>Java</option>
                <option>HTML</option>
                <option>CSS</option>
                <option>Python</option>
            </select>
        </div>

        <div class="form-group checkbox">
            <input type="checkbox" id="terms">
            <label for="terms">I agree to the terms</label>
        </div>

        <button type="submit">Create Account</button>
    </form>
    </section>

        <section class="cards">

            <div class="card">
                <h3>Java</h3>
                <p>Learning object-oriented programming.</p>
                <button>View Course</button>
            </div>

            <div class="card">
                <h3>HTML</h3>
                <p>Building websites with semantic HTML.</p>
                <button>View Course</button>
            </div>

            <div class="card">
                <h3>CSS</h3>
                <p>Learning how to style web pages.</p>
                <button>View Course</button>
            </div>

            <div class="card">
                <h3>Python</h3>
                <p>Exploring programming and data.</p>
                <button>View Course</button>
            </div>

        </section>

    </main>


    <div class="help">
        ?
    </div>

</body>
</html>
